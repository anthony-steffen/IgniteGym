services:
  api:
    build: ./backend
    container_name: ignitegym_api
    command: sh -c "npm run db:migrate && npm run dev"
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      db:
        condition: service_healthy
    env_file:
       - ./backend/.env.docker
    environment:
      - DOCKER=true

  db:
    image: mysql:8.0
    container_name: ignitegym_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: ignitegym
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpass
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padminpass"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
